name: P0 Deploy Alerts Web

on:
  push:
    branches:
      - fix/p0-deploy-alerts-web-2026-08-27
    paths:
      - ".github/workflows/p0-deploy-alerts-web.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact verified Web merge
        uses: actions/checkout@v4
        with:
          ref: 9451904f4fbe48001bd2fb6ccfcae4c79e452f56
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require scoped Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 2; }
      - name: Install dependencies
        run: npm ci
      - name: Deploy exact verified Web merge to Cloudflare
        run: npm run deploy
