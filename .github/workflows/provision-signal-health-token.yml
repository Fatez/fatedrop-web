name: Provision FateDrop Signal Health Token

on:
  workflow_run:
    workflows: ["Verify FateDrop Web"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fatedrop-signal-health-token
  cancel-in-progress: true

jobs:
  provision:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FATEDROP_SIGNAL_API_TOKEN: ${{ secrets.FATEDROP_SIGNAL_API_TOKEN }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1

      - name: Reject superseded verified commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$VERIFIED_SHA" ]; then
            echo "Verified commit has been superseded; skipping stale token provisioning."
            echo "provision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "provision=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        if: steps.latest.outputs.provision == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require private diagnostic credentials
        if: steps.latest.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          test -n "${FATEDROP_SIGNAL_API_TOKEN:-}" || { echo "Missing FATEDROP_SIGNAL_API_TOKEN"; exit 2; }

      - name: Install locked dependencies
        if: steps.latest.outputs.provision == 'true'
        run: npm ci

      - name: Provision Web Signal API token
        if: steps.latest.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FATEDROP_SIGNAL_API_TOKEN" | npx wrangler secret put FATEDROP_SIGNAL_API_TOKEN

      - name: Verify private Signal health bridge
        if: steps.latest.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLOUD="https://fatedrop-cloud-production.up.railway.app"
          WEB="https://fatedrop.co.uk"

          cloud_public_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$CLOUD/api/signal-health")"
          test "$cloud_public_status" = "401" || { echo "Cloud private diagnostic boundary changed: $cloud_public_status"; exit 1; }

          web_status="$(curl --silent --show-error --retry 8 --retry-delay 3 --output /tmp/signal-health.json --write-out '%{http_code}' "$WEB/api/health/signal")"
          if [ "$web_status" != "200" ]; then
            echo "Web Signal health bridge returned HTTP $web_status"
            node -e '
              const fs=require("fs");
              const body=fs.existsSync("/tmp/signal-health.json") ? fs.readFileSync("/tmp/signal-health.json","utf8") : "";
              try {
                const result=JSON.parse(body);
                console.error(`Signal health bridge reason: ${String(result.reason || "unknown").slice(0,100)}`);
              } catch {
                console.error("Signal health bridge returned a non-JSON error response.");
              }
            '
            exit 22
          fi

          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/signal-health.json","utf8"));
            if (result.available !== true) throw new Error("Web Signal health bridge did not return canonical available=true");
            console.log("Web Signal health bridge is authenticated and available.");
          '
