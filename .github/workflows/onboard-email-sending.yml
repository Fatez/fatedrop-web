name: Onboard FateDrop Email Sending

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/onboard-email-sending.yml"

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FATEDROP_EMAIL_DOMAIN: fatedrop.co.uk
    steps:
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Onboard FateDrop Email Sending domain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          curl --fail --silent --show-error \
            -H "$auth_header" \
            "$api/zones?name=$FATEDROP_EMAIL_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID&status=active&per_page=50" \
            -o /tmp/fatedrop-zone.json

          zone_id="$(node -e '
            const fs=require("fs");
            const payload=JSON.parse(fs.readFileSync("/tmp/fatedrop-zone.json","utf8"));
            if (payload.success !== true || !Array.isArray(payload.result)) process.exit(2);
            const exact=payload.result.filter((zone) => zone?.name === process.env.FATEDROP_EMAIL_DOMAIN && zone?.status === "active");
            if (exact.length !== 1 || !exact[0]?.id) process.exit(3);
            process.stdout.write(String(exact[0].id));
          ')"

          curl --silent --show-error \
            -H "$auth_header" \
            "$api/zones/$zone_id/email/sending/subdomains" \
            -o /tmp/email-sending-domains.json

          existing_tag="$(node -e '
            const fs=require("fs");
            const payload=JSON.parse(fs.readFileSync("/tmp/email-sending-domains.json","utf8"));
            if (payload.success !== true || !Array.isArray(payload.result)) process.exit(0);
            const item=payload.result.find((entry) => entry?.name === process.env.FATEDROP_EMAIL_DOMAIN && entry?.enabled === true);
            process.stdout.write(String(item?.tag || ""));
          ')"

          if [ -n "$existing_tag" ]; then
            echo "FateDrop Email Sending domain is already enabled."
          else
            http_status="$(curl --silent --show-error \
              --output /tmp/email-sending-onboard.json \
              --write-out '%{http_code}' \
              -X POST \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              --data "$(node -e 'process.stdout.write(JSON.stringify({name: process.env.FATEDROP_EMAIL_DOMAIN}))')" \
              "$api/zones/$zone_id/email/sending/subdomains")"

            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "Cloudflare Email Sending onboarding returned HTTP $http_status"
              node -e '
                const fs=require("fs");
                const body=fs.existsSync("/tmp/email-sending-onboard.json") ? fs.readFileSync("/tmp/email-sending-onboard.json","utf8") : "";
                try {
                  const payload=JSON.parse(body);
                  const errors=Array.isArray(payload.errors) ? payload.errors.slice(0,3).map((e) => `${e.code || "?"}: ${String(e.message || "unknown").slice(0,180)}`) : [];
                  console.error(errors.length ? `Cloudflare Email Sending onboarding failed: ${errors.join(" | ")}` : "Cloudflare Email Sending onboarding failed without a provider error.");
                } catch {
                  console.error("Cloudflare Email Sending onboarding returned a non-JSON error response.");
                }
              '
              exit 24
            fi

            node -e '
              const fs=require("fs");
              const payload=JSON.parse(fs.readFileSync("/tmp/email-sending-onboard.json","utf8"));
              if (payload.success !== true || payload.result?.name !== process.env.FATEDROP_EMAIL_DOMAIN || payload.result?.enabled !== true || !payload.result?.tag) {
                throw new Error("Cloudflare did not confirm the FateDrop Email Sending domain as enabled");
              }
              process.stdout.write(String(payload.result.tag));
            ' > /tmp/email-sending-tag.txt
            existing_tag="$(cat /tmp/email-sending-tag.txt)"
            echo "FateDrop Email Sending domain onboarding accepted."
          fi

          curl --fail --silent --show-error \
            -H "$auth_header" \
            "$api/zones/$zone_id/email/sending/subdomains/$existing_tag/dns" \
            -o /tmp/email-sending-dns.json

          node -e '
            const fs=require("fs");
            const payload=JSON.parse(fs.readFileSync("/tmp/email-sending-dns.json","utf8"));
            if (payload.success !== true || !Array.isArray(payload.result) || payload.result.length < 3) {
              throw new Error("Cloudflare did not return the expected Email Sending DNS record set");
            }
            console.log(`Cloudflare Email Sending DNS record set present (${payload.result.length} records).`);
          '
