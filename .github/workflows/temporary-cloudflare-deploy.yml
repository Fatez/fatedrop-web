name: Temporary Cloudflare Production Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-cloudflare-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'agent/temporary-cloudflare-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://fatedrop-web.fatedrop-web.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN repository secret is not configured.'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID repository secret is not configured.'; exit 2; }
      - name: Install dependencies
        run: npm ci
      - name: Deploy current FateDrop website to Cloudflare
        run: npm run deploy
