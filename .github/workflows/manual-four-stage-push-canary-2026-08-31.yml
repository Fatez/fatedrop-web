name: Manual Four Stage Push Canary 2026-08-31

on:
  push:
    branches:
      - ops/four-stage-push-canary-2026-08-31
    paths:
      - .github/workflows/manual-four-stage-push-canary-2026-08-31.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: fatedrop-manual-four-stage-push-canary-2026-08-31
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rotate production push canary secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          canary_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$canary_secret"
          printf '%s' "$canary_secret" | npx wrangler secret put FATEDROP_PUSH_CRON_SECRET
          printf 'FATEDROP_PUSH_CRON_SECRET=%s\n' "$canary_secret" >> "$GITHUB_ENV"
          unset canary_secret

      - name: Diagnose Whisper Echo Manifested production canaries
        id: send
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          WEB="https://fatedrop.co.uk"
          : > /tmp/fatedrop-four-stage-results.md
          echo "Production three-stage diagnostic run: $GITHUB_RUN_ID" >> /tmp/fatedrop-four-stage-results.md
          echo >> /tmp/fatedrop-four-stage-results.md
          overall=0
          for kind in whisper echo manifested; do
            output="/tmp/${kind}.json"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
              -X POST \
              -H "Authorization: Bearer $FATEDROP_PUSH_CRON_SECRET" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "{\"kind\":\"$kind\"}" \
              "$WEB/api/dashboard/push-canary" \
              -o "$output" \
              -w '%{http_code}' || echo 000)"
            if node - "$kind" "$status" "$output" <<'NODE' >> /tmp/fatedrop-four-stage-results.md
          const fs = require('fs');
          const [kind, status, file] = process.argv.slice(2);
          let result = {};
          try { result = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          const outcome = Array.isArray(result.outcomes) ? result.outcomes[0] : null;
          const ok = status === '200' && result.accepted === true && outcome?.kind === kind && outcome?.state === 'sent' && Boolean(outcome?.providerMessageId);
          console.log(`- ${kind.toUpperCase()}: ${ok ? 'PROVIDER ACCEPTED' : 'BLOCKED'} | http=${status} | reason=${result.reason ?? result.error ?? 'unknown'} | state=${outcome?.state ?? 'missing'} | providerMessageId=${outcome?.providerMessageId ?? 'none'} | deliveryResult=${outcome?.deliveryResult ?? 'none'} | eligibleUsers=${result.eligibleUsers ?? 'n/a'} | eligibleEndpoints=${result.eligibleEndpoints ?? 'n/a'}`);
          if (!ok) process.exit(1);
          NODE
            then
              :
            else
              overall=1
            fi
          done
          echo >> /tmp/fatedrop-four-stage-results.md
          echo "Vanished was already provider-accepted in prior run 33370355120." >> /tmp/fatedrop-four-stage-results.md
          echo "Canonical stock/history mutation: NONE (push canary only)." >> /tmp/fatedrop-four-stage-results.md
          exit "$overall"

      - name: Record QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          title="[FATEDROP PUSH QA] Three-stage diagnostic run $GITHUB_RUN_ID"
          if [ ! -s /tmp/fatedrop-four-stage-results.md ]; then
            printf 'Three-stage diagnostic did not reach the result-writing step.\n' > /tmp/fatedrop-four-stage-results.md
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/fatedrop-four-stage-results.md

      - name: Enforce provider acceptance
        if: steps.send.outcome != 'success'
        run: exit 1
