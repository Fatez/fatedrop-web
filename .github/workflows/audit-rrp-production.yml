name: Audit FateDrop RRP Production

on:
  workflow_run:
    workflows: ["Deploy FateDrop Web Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatedrop-rrp-production-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Install locked dependencies
        run: npm ci

      - name: Rotate isolated RRP audit secret
        shell: bash
        run: |
          set -euo pipefail
          audit_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$audit_secret"
          printf '%s' "$audit_secret" | npx wrangler secret put FATEDROP_RRP_AUDIT_SECRET
          printf 'FATEDROP_RRP_AUDIT_SECRET=%s\n' "$audit_secret" >> "$GITHUB_ENV"
          unset audit_secret

      - name: Detect pre-RRP recovery checkpoint deploy
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[rrp-recovery-checkpoint]'; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture durable pre-RRP recovery checkpoint
        if: steps.checkpoint.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          WEB="https://fatedrop.co.uk"
          checkpoint_status=''
          for attempt in 1 2 3 4 5 6; do
            checkpoint_status="$(curl --silent --show-error \
              --output /tmp/rrp-recovery-checkpoint.json \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $FATEDROP_RRP_AUDIT_SECRET" \
              -H "Accept: application/json" \
              "$WEB/api/dashboard/rrp-recovery-checkpoint")"
            if [ "$checkpoint_status" = "200" ]; then
              break
            fi
            if [ "$checkpoint_status" != "401" ]; then
              break
            fi
            echo "RRP audit secret not active for checkpoint yet (attempt $attempt/6); retrying."
            sleep 3
          done
          test "$checkpoint_status" = "200" || {
            echo "RRP recovery checkpoint returned HTTP $checkpoint_status"
            exit 20
          }

          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/rrp-recovery-checkpoint.json', 'utf8'));
          if (result?.accepted !== true || result?.complete !== true) throw new Error('RRP recovery checkpoint was not accepted');
          if (!result.checkpointId || Number(result.snapshotCount) <= 0) throw new Error('RRP recovery checkpoint is empty');
          if (Number(result.snapshotCount) !== Number(result.expectedIdentityCount)) throw new Error('RRP recovery checkpoint count mismatch');
          if (Number(result.captureVersions) !== 1) throw new Error('RRP recovery checkpoint contains multiple capture versions');
          console.log(JSON.stringify({
            checkpointId: result.checkpointId,
            created: result.created,
            capturedAt: result.capturedAt,
            snapshotCount: result.snapshotCount,
            expectedIdentityCount: result.expectedIdentityCount,
            canonicalCountNow: result.canonicalCountNow,
            captureVersions: result.captureVersions,
            complete: result.complete,
          }));
          NODE

      - name: Read production RRP audit
        shell: bash
        run: |
          set -euo pipefail
          WEB="https://fatedrop.co.uk"

          public_status="$(curl --silent --show-error --retry 5 --retry-delay 3 \
            --output /tmp/rrp-audit-public.json \
            --write-out '%{http_code}' \
            "$WEB/api/health/rrp-audit")"
          test "$public_status" = "200" || {
            echo "Public RRP aggregate audit returned HTTP $public_status"
            exit 21
          }

          detail_status=''
          for attempt in 1 2 3 4 5 6; do
            detail_status="$(curl --silent --show-error \
              --output /tmp/rrp-audit-detail.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $FATEDROP_RRP_AUDIT_SECRET" \
              -H "Accept: application/json" \
              "$WEB/api/health/rrp-audit?detail=1")"
            if [ "$detail_status" = "200" ]; then
              break
            fi
            if [ "$detail_status" != "401" ]; then
              break
            fi
            echo "RRP audit secret not active for detail yet (attempt $attempt/6); retrying."
            sleep 3
          done
          test "$detail_status" = "200" || {
            echo "Protected RRP detail audit returned HTTP $detail_status"
            exit 22
          }

          node <<'NODE'
          const fs = require('fs');
          const publicAudit = JSON.parse(fs.readFileSync('/tmp/rrp-audit-public.json', 'utf8'));
          const detailAudit = JSON.parse(fs.readFileSync('/tmp/rrp-audit-detail.json', 'utf8'));
          if (publicAudit?.ok !== true || detailAudit?.ok !== true) throw new Error('RRP production audit contract mismatch');
          if (JSON.stringify(publicAudit.totals) !== JSON.stringify(detailAudit.totals)) throw new Error('RRP public/detail aggregate mismatch');
          if (!Array.isArray(detailAudit.candidates)) throw new Error('Protected RRP candidate list missing');
          const report = {
            auditedAt: detailAudit.auditedAt,
            totals: detailAudit.totals,
            byTcg: detailAudit.byTcg,
            byProductType: detailAudit.byProductType,
            verifiedSources: detailAudit.verifiedSources,
            candidates: detailAudit.candidates,
          };
          console.log(JSON.stringify(report));
          NODE
