name: Manual Push Production Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: fatedrop-manual-push-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.actor == 'Fatez' && startsWith(github.event.issue.title, '[FATEDROP PUSH TEST] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve exact test kind
        id: kind
        shell: bash
        run: |
          set -euo pipefail
          prefix='[FATEDROP PUSH TEST] '
          kind="${ISSUE_TITLE#"$prefix"}"
          case "$kind" in
            local-radar|whisper|echo|manifested|vanished) ;;
            *)
              echo "Unsupported push-test kind: $kind" >&2
              exit 2
              ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rotate isolated test-only push secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }
          push_test_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$push_test_secret"
          printf '%s' "$push_test_secret" | npx wrangler secret put FATEDROP_PUSH_TEST_SECRET
          printf 'FATEDROP_PUSH_TEST_SECRET=%s\n' "$push_test_secret" >> "$GITHUB_ENV"
          unset push_test_secret

      - name: Send one production test alert
        env:
          CANARY_KIND: ${{ steps.kind.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          WEB="https://fatedrop.co.uk"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $FATEDROP_PUSH_TEST_SECRET" \
            -H "Accept: application/json" \
            "$WEB/api/dashboard/push-canary?kind=$CANARY_KIND" \
            -o /tmp/push-canary.json
          node -e '
            const fs=require("fs");
            const expected=process.env.CANARY_KIND;
            const result=JSON.parse(fs.readFileSync("/tmp/push-canary.json","utf8"));
            if (result.accepted !== true) throw new Error(`Push canary rejected: ${result.reason || "unknown"}`);
            if (result.selectedKind !== expected) throw new Error(`Expected selected kind ${expected}, got ${result.selectedKind}`);
            if (!Array.isArray(result.outcomes) || result.outcomes.length !== 1) throw new Error("Expected exactly one canary outcome");
            const outcome=result.outcomes[0];
            if (outcome.kind !== expected) throw new Error(`Unexpected canary kind: ${outcome.kind}`);
            if (outcome.state !== "sent" || !outcome.providerMessageId) {
              throw new Error(`${outcome.kind} did not reach Expo acceptance: ${outcome.state || "unknown"}`);
            }
            console.log(`${outcome.kind}: sent provider=${outcome.providerMessageId}`);
          '
