name: Verify Oru & Friends integration

on:
  push:
    branches:
      - agent/koru-friends-3d-integration-2026-08-22

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Next.js application
        run: npm run verify
      - name: Verify OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
