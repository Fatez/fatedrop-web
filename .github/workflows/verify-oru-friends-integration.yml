name: Verify Oru & Friends integration

on:
  push:
    branches:
      - agent/koru-friends-3d-integration-2026-08-22
    paths:
      - package.json
      - package-lock.json
      - components/companion-renderer.tsx
      - lib/companion-contract.ts
      - .github/workflows/verify-oru-friends-integration.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/koru-friends-3d-integration-2026-08-22
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record proof
        shell: bash
        run: |
          set +e
          npm ci > /tmp/oru-install.log 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            npm run verify > /tmp/oru-verify.log 2>&1
            verify_status=$?
          else
            verify_status=99
            echo "Skipped because npm ci failed." > /tmp/oru-verify.log
          fi

          if [ "$install_status" -eq 0 ] && [ "$verify_status" -eq 0 ]; then
            npx opennextjs-cloudflare build > /tmp/oru-opennext.log 2>&1
            opennext_status=$?
          else
            opennext_status=99
            echo "Skipped because an earlier gate failed." > /tmp/oru-opennext.log
          fi

          if [ "$install_status" -eq 0 ] && [ "$verify_status" -eq 0 ] && [ "$opennext_status" -eq 0 ]; then
            result=PASS
            overall=0
          else
            result=FAIL
            overall=1
          fi

          {
            echo "# Oru & Friends integration CI proof"
            echo
            echo "Generated by the isolated integration branch workflow."
            echo
            echo "- Result: **$result**"
            echo "- npm ci: $install_status"
            echo "- npm run verify: $verify_status"
            echo "- OpenNext Cloudflare build: $opennext_status"
            echo
            echo "## npm ci tail"
            echo '```text'
            tail -n 35 /tmp/oru-install.log
            echo '```'
            echo
            echo "## npm run verify tail"
            echo '```text'
            tail -n 80 /tmp/oru-verify.log
            echo '```'
            echo
            echo "## OpenNext build tail"
            echo '```text'
            tail -n 80 /tmp/oru-opennext.log
            echo '```'
          } > docs/oru-friends-ci-proof.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/oru-friends-ci-proof.md
          git commit -m "Record Oru & Friends integration verification" || true
          git push
          exit "$overall"
