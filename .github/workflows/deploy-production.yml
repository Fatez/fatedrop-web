name: Deploy FateDrop Web Production

on:
  workflow_run:
    workflows: ["Verify FateDrop Web"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fatedrop-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deployed: ${{ steps.latest.outputs.deploy }}
      verified_sha: ${{ github.event.workflow_run.head_sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1

      - name: Reject a superseded verified commit
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$VERIFIED_SHA" ]; then
            echo "Verified commit $VERIFIED_SHA has been superseded by main $current_main; skipping stale production deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require production deployment credentials
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Verify production signal-engine secret binding
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          settings_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/fatedrop-web/settings"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$settings_api" \
            -o /tmp/fatedrop-worker-settings.json
          node -e '
            const fs=require("fs");
            const payload=JSON.parse(fs.readFileSync("/tmp/fatedrop-worker-settings.json","utf8"));
            const bindings=Array.isArray(payload.result?.bindings) ? payload.result.bindings : [];
            const binding=bindings.find((item) => item?.name === "FATEDROP_SIGNAL_API_TOKEN");
            if (!binding || !String(binding.type || "").includes("secret")) {
              throw new Error("Production Worker is missing the FATEDROP_SIGNAL_API_TOKEN secret binding");
            }
          '

      - name: Install locked dependencies
        if: steps.latest.outputs.deploy == 'true'
        run: npm ci

      - name: Ensure production Turnstile widget
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          TURNSTILE_WIDGET_NAME: FateDrop Web Production
          TURNSTILE_DOMAIN: fatedrop.co.uk
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets"
          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          curl --fail --silent --show-error \
            -H "$auth_header" \
            "$api?per_page=1000" \
            -o /tmp/turnstile-widgets.json

          turnstile_sitekey="$(node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/turnstile-widgets.json", "utf8"));
            if (payload.success !== true || !Array.isArray(payload.result)) process.exit(2);
            const domain = process.env.TURNSTILE_DOMAIN;
            const name = process.env.TURNSTILE_WIDGET_NAME;
            const widgets = payload.result;
            const widget = widgets.find((item) => item?.name === name && item?.domains?.includes(domain))
              || widgets.find((item) => item?.domains?.includes(domain));
            process.stdout.write(String(widget?.sitekey || ""));
          ')"

          if [ -n "$turnstile_sitekey" ]; then
            curl --fail --silent --show-error \
              -H "$auth_header" \
              "$api/$turnstile_sitekey" \
              -o /tmp/turnstile-widget.json
          else
            node -e '
              const fs = require("fs");
              fs.writeFileSync("/tmp/turnstile-create.json", JSON.stringify({
                domains: [process.env.TURNSTILE_DOMAIN],
                mode: "managed",
                name: process.env.TURNSTILE_WIDGET_NAME,
              }));
            '
            curl --fail --silent --show-error \
              -X POST \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/turnstile-create.json \
              "$api" \
              -o /tmp/turnstile-widget.json
          fi

          turnstile_sitekey="$(node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/turnstile-widget.json", "utf8"));
            if (payload.success !== true || !payload.result?.sitekey || !payload.result?.secret) process.exit(2);
            if (!Array.isArray(payload.result.domains) || !payload.result.domains.includes(process.env.TURNSTILE_DOMAIN)) process.exit(3);
            process.stdout.write(String(payload.result.sitekey));
          ')"
          turnstile_secret="$(node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/turnstile-widget.json", "utf8"));
            process.stdout.write(String(payload.result.secret));
          ')"

          echo "::add-mask::$turnstile_secret"
          echo "::add-mask::$turnstile_sitekey"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({secret: process.argv[1], response: ""}))' "$turnstile_secret")" \
            "https://challenges.cloudflare.com/turnstile/v0/siteverify" \
            -o /tmp/turnstile-siteverify.json
          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/turnstile-siteverify.json","utf8"));
            const codes=Array.isArray(result["error-codes"]) ? result["error-codes"] : [];
            if (codes.includes("invalid-input-secret") || codes.includes("missing-input-secret")) {
              throw new Error("Cloudflare rejected the production Turnstile secret");
            }
          '

          printf '%s' "$turnstile_sitekey" | npx wrangler secret put TURNSTILE_SITE_KEY
          printf '%s' "$turnstile_secret" | npx wrangler secret put TURNSTILE_SECRET_KEY
          unset turnstile_sitekey turnstile_secret

      - name: Rotate Web push cron secret
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          push_cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$push_cron_secret"
          printf '%s' "$push_cron_secret" | npx wrangler secret put FATEDROP_PUSH_CRON_SECRET
          printf 'FATEDROP_PUSH_CRON_SECRET=%s\n' "$push_cron_secret" >> "$GITHUB_ENV"
          unset push_cron_secret

      - name: Deploy verified commit to Cloudflare
        if: steps.latest.outputs.deploy == 'true'
        run: npm run deploy

      - name: Apply and verify production database migrations
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          WEB="https://fatedrop.co.uk"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer $FATEDROP_PUSH_CRON_SECRET" \
            -H "Accept: application/json" \
            "$WEB/api/dashboard/production-migrations" \
            -o /tmp/production-migrations.json
          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/production-migrations.json","utf8"));
            if (result.accepted !== true) throw new Error("Production migration gate was not accepted");
            if (!Array.isArray(result.pending) || result.pending.length !== 0) throw new Error("Production migrations remain pending");
            if (result.vanishedDefaultVerified !== true || Number(result.historicalAsymmetryCount) !== 0) throw new Error("Lifecycle preference migration verification failed");
          '

      - name: Exercise canonical production push dispatcher
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          WEB="https://fatedrop.co.uk"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $FATEDROP_PUSH_CRON_SECRET" \
            -H "Accept: application/json" \
            "$WEB/api/dashboard/push-dispatch" \
            -o /tmp/push-dispatch.json
          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/push-dispatch.json","utf8"));
            if (result.accepted !== true || result.enabled !== true) throw new Error("Canonical push dispatcher production exercise failed");
          '

      - name: Run one-shot Vanished production canary
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%B | grep -Fq '[vanished-canary]'; then
            echo "No [vanished-canary] marker on this verified commit; skipping one-shot device canary."
            exit 0
          fi
          WEB="https://fatedrop.co.uk"
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $FATEDROP_PUSH_CRON_SECRET" \
            -H "Accept: application/json" \
            "$WEB/api/dashboard/push-canary" \
            -o /tmp/push-canary.json
          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/push-canary.json","utf8"));
            if (result.accepted !== true) throw new Error(`Vanished canary was not accepted: ${result.reason || result.state || "unknown"}`);
            if (result.eventType !== "vanished" || result.state !== "sent") throw new Error("Vanished canary did not reach sent state");
            if (!result.providerMessageId) throw new Error("Vanished canary is missing the Expo provider message id");
            console.log(`Vanished canary sent; outbox=${result.outboxId}; provider=${result.providerMessageId}`);
          '

  smoke:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove deployed Cloud and Web contracts
        shell: bash
        run: |
          set -euo pipefail
          CLOUD="https://fatedrop-cloud-production.up.railway.app"
          WEB="https://fatedrop.co.uk"

          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$CLOUD/api/signals?limit=1" -o /tmp/signals.json
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$CLOUD/api/signal-summary" -o /tmp/summary.json
          node -e '
            const fs=require("fs");
            const signals=JSON.parse(fs.readFileSync("/tmp/signals.json","utf8"));
            const summary=JSON.parse(fs.readFileSync("/tmp/summary.json","utf8"));
            if (signals.contractVersion !== 1 || signals.source !== "FATEDROP_CLOUD") throw new Error("Cloud /api/signals contract drift");
            if (summary.contractVersion !== 1 || summary.source !== "FATEDROP_CLOUD" || summary.available !== true) throw new Error("Cloud /api/signal-summary contract drift");
          '

          health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$CLOUD/api/signal-health")"
          test "$health" = "401" || { echo "Cloud private diagnostic boundary changed: $health"; exit 1; }

          check_status() {
            local path="$1"
            local expected="$2"
            local code
            code="$(curl --silent --show-error --retry 5 --retry-delay 3 --output /tmp/web-route.out --write-out '%{http_code}' "$WEB$path")"
            test "$code" = "$expected" || {
              echo "$path expected HTTP $expected but received $code"
              cat /tmp/web-route.out
              exit 1
            }
          }

          check_available() {
            local path="$1"
            local code
            code="$(curl --silent --show-error --retry 5 --retry-delay 3 --output /tmp/web-route.out --write-out '%{http_code}' "$WEB$path")"
            if [ "$code" = "404" ] || [ "$code" -ge 500 ]; then
              echo "$path failed production route smoke with HTTP $code"
              cat /tmp/web-route.out
              exit 1
            fi
          }

          check_status "/" "200"
          check_status "/api/mobile/session" "401"
          check_status "/api/mobile/alerts" "401"
          check_status "/api/health/push" "204"
          check_status "/api/health/fatefind-instant" "204"
          check_available "/api/trader/cards?q=Furret&limit=1"
          check_available "/api/network-status"

          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$WEB/account/register" -o /tmp/register.html
          grep -Fq 'cf-turnstile' /tmp/register.html || { echo "Registration page is missing the Turnstile widget"; exit 1; }
          if grep -Fq 'Security verification is unavailable.' /tmp/register.html; then
            echo "Registration page still reports unavailable security verification"
            exit 1
          fi

          register_status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/register-probe.json \
            -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://fatedrop.co.uk' \
            -H 'Content-Type: application/json' \
            --data '{"displayName":"FateDrop Production Probe","email":"production-probe@invalid.example","password":"not-a-real-password-123","confirmPassword":"not-a-real-password-123","acceptTerms":true,"turnstileToken":""}' \
            "$WEB/api/auth/register")"
          test "$register_status" = "403" || {
            echo "Registration Turnstile server gate expected HTTP 403 but received $register_status"
            cat /tmp/register-probe.json
            exit 1
          }
          node -e '
            const fs=require("fs");
            const result=JSON.parse(fs.readFileSync("/tmp/register-probe.json","utf8"));
            if (result.error !== "Security verification failed. Please try again.") {
              throw new Error("Registration Turnstile server gate returned an unexpected response");
            }
          '
