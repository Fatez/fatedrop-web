name: P0 Canonical Shape Diagnostic

on:
  push:
    branches:
      - diagnostic/p0-canonical-shape-2026-08-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live canonical alert identity reuse
        shell: bash
        run: |
          set -euo pipefail
          CLOUD="https://fatedrop-cloud-production.up.railway.app"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$CLOUD/api/signals?detail=alerts&limit=100" \
            -o /tmp/alerts.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/alerts.json', 'utf8'));
          const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
          const byId = new Map();
          for (const a of alerts) {
            const id = String(a?.id || '');
            const t = String(a?.detectedAt || '');
            if (!id) continue;
            const row = byId.get(id) || { count: 0, times: new Set(), stages: new Set(), products: new Set() };
            row.count += 1;
            row.times.add(t);
            row.stages.add(String(a?.fateStage || ''));
            row.products.add(String(a?.productId || ''));
            byId.set(id, row);
          }
          const reused = [...byId.entries()].filter(([, row]) => row.count > 1 || row.times.size > 1);
          const now = Date.now();
          const recent = alerts.filter((a) => {
            const t = Date.parse(String(a?.detectedAt || ''));
            return Number.isFinite(t) && t <= now + 60_000 && now - t <= 24 * 60 * 60_000;
          });
          console.log('identity', {
            returned: alerts.length,
            uniqueIds: byId.size,
            reusedIds: reused.length,
            uniqueIdTimestampPairs: new Set(alerts.map((a) => `${a?.id || ''}|${a?.detectedAt || ''}`)).size,
            recent24h: recent.length,
            oldestAgeMinutes: alerts.length ? Math.round(Math.max(...alerts.map((a) => now - Date.parse(String(a?.detectedAt || ''))).filter(Number.isFinite)) / 60000) : null,
            newestAgeSeconds: alerts.length ? Math.round(Math.min(...alerts.map((a) => now - Date.parse(String(a?.detectedAt || ''))).filter(Number.isFinite)) / 1000) : null,
          });
          console.log('reusedSample', reused.slice(0, 20).map(([id,row]) => ({ id, count: row.count, timestamps: row.times.size, stages: [...row.stages], products: row.products.size })));
          console.log('recentSample', recent.slice(0, 20).map((a) => ({ id: a?.id, detectedAt: a?.detectedAt, stage: a?.fateStage, productId: a?.productId })));
          NODE

      - name: Inspect production push aggregates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            'https://fatedrop.co.uk/api/health/push?detail=1'
          echo
