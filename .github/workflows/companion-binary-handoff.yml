name: Companion Binary Handoff

on:
  push:
    paths:
      - ".handoff/companion/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/web-koru-final-revamp-2026-08-21
          fetch-depth: 1
      - name: Rebuild verified web companion assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/companions/koru public/assets/companions/fenn
          cat .handoff/companion/koru.final.* | tr -d '\n' | base64 --decode > public/assets/companions/koru/koru.glb
          cat .handoff/companion/fenn.final.* | tr -d '\n' | base64 --decode > public/assets/companions/fenn/fenn.glb
          echo "1cad455e92b1e4d705432e08dba93efe953116d313c01aa6a836f4e0295364fa  public/assets/companions/koru/koru.glb" | sha256sum --check
          echo "a499b5b5138e569c39aec611341ef1f1de05fb68391f6299c3f1f1f1ab793839  public/assets/companions/fenn/fenn.glb" | sha256sum --check
          test "$(head -c 4 public/assets/companions/koru/koru.glb)" = "glTF"
          test "$(head -c 4 public/assets/companions/fenn/fenn.glb)" = "glTF"
      - name: Commit binary assets and clear handoff staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .handoff/companion
          git config user.name "FateDrop Companion Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/assets/companions/koru public/assets/companions/fenn .handoff/companion
          git commit -m "Add optimized Koru and Fenn web GLBs"
          git push origin HEAD:agent/web-koru-final-revamp-2026-08-21
