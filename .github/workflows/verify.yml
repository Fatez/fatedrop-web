name: Verify FateDrop Web

on:
  push:
    branches: [main, security/p0-web-turnstile-current]
  pull_request:
    branches: [main, fatedrop-network-consistency-audit]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Next.js application
        run: npm run verify
      - name: Verify OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
