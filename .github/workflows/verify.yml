name: Verify FateDrop Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fatedrop-network-consistency-audit]

permissions:
  contents: write

jobs:
  dependency_update:
    if: github.event_name == 'pull_request' && github.head_ref == 'launch-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout launch branch head
        uses: actions/checkout@v4
        with:
          ref: launch-foundation-v1
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Align Next runtime and lint tooling
        shell: bash
        run: |
          if grep -q '"next": "\^16.3.0"' package.json && grep -q '"eslint-config-next": "16.3.0"' package.json; then
            echo "Next runtime and lint tooling already aligned."
            exit 0
          fi
          npm install next@16.3.0 eslint-config-next@16.3.0 --save-exact
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies.next='^16.3.0';p.devDependencies['eslint-config-next']='16.3.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align Next runtime and lint tooling to 16.3.0"
          git push origin HEAD:launch-foundation-v1

  verify:
    if: always()
    needs: [dependency_update]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Next.js application
        run: npm run verify
      - name: Verify OpenNext Cloudflare build
        run: npx opennextjs-cloudflare build
