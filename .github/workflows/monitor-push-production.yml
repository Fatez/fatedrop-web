name: Monitor FateDrop Push Production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatedrop-push-production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require fresh production push heartbeat
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 --output /dev/null --write-out '%{http_code}' https://fatedrop.co.uk/api/health/push)"
          test "$code" = "204" || {
            echo "FateDrop production push health check failed with HTTP $code"
            exit 1
          }

      - name: Report redacted latest Local Radar TEST ONLY delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 \
            --output /tmp/local-radar-test-delivery.json \
            --write-out '%{http_code}' \
            'https://fatedrop.co.uk/api/health/local-radar-test-delivery')"
          test "$code" = "200" || {
            echo "Local Radar TEST ONLY delivery diagnostic failed with HTTP $code"
            exit 1
          }
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/local-radar-test-delivery.json', 'utf8'));
          if (result?.ok !== true) {
            throw new Error('Local Radar TEST ONLY delivery diagnostic contract mismatch');
          }
          if (result.eventId !== null && !/^local-radar-operator-test:[1-9][0-9]*$/.test(result.eventId)) {
            throw new Error('Latest Local Radar TEST ONLY event id is invalid');
          }
          console.log(JSON.stringify(result));
          NODE

      - name: Report redacted burst-policy production evidence
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 3 --retry-delay 5 \
            --output /tmp/push-burst.json \
            --write-out '%{http_code}' \
            'https://fatedrop.co.uk/api/health/push-burst')"
          test "$code" = "200" || {
            echo "Burst-policy production diagnostic failed with HTTP $code"
            exit 1
          }
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/push-burst.json', 'utf8'));
          if (result?.ok !== true) throw new Error('Burst-policy production diagnostic contract mismatch');
          if (result.manifestedSummary !== 0) throw new Error('Manifested alerts must never be summarized');
          if (result.invalidSummaryCount !== 0) throw new Error('Invalid burst summary detected');
          if (result.summaryFailed !== 0) throw new Error('Failed burst summary detected');
          if (result.summaryReceiptError !== 0) throw new Error('Burst summary receipt error detected');
          if (result.summaryTotal > 0 && (!Number.isInteger(result.minSummaryCount) || result.minSummaryCount < 5)) {
            throw new Error('Burst summary below minimum size detected');
          }
          console.log(JSON.stringify(result));
          NODE
