name: Apply dashboard clarity pass

on:
  push:
    branches:
      - agent/web-koru-final-revamp-2026-08-21
    paths:
      - scripts/apply-dashboard-clarity.mjs

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: agent/web-koru-final-revamp-2026-08-21
      - name: Apply deterministic dashboard copy patch
        run: node scripts/apply-dashboard-clarity.mjs
      - name: Commit generated dashboard changes
        shell: bash
        run: |
          if git diff --quiet -- app/dashboard/page.tsx; then
            echo "Dashboard clarity pass already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/page.tsx
          git commit -m "Clarify dashboard product language"
          git push
