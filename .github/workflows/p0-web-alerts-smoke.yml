name: P0 Web Alerts Production Smoke

on:
  push:
    branches:
      - fix/p0-deploy-alerts-web-2026-08-27
    paths:
      - ".github/workflows/p0-web-alerts-smoke.yml"

permissions:
  contents: read

jobs:
  alerts-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify signed-in Alerts on deployed Web
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fatedrop.co.uk"
          EMAIL="p0-alerts-smoke-20260827-0400@fatedrop.invalid"
          PASSWORD="P0-$(openssl rand -hex 18)-Aa9!"
          export EMAIL PASSWORD

          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/register.json', JSON.stringify({
            displayName: 'P0 Alerts Smoke',
            email: process.env.EMAIL,
            password: process.env.PASSWORD,
          }));
          NODE

          register_status="$(curl --silent --show-error --location \
            --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
            -H "Origin: $BASE" -H "Content-Type: application/json" \
            --data-binary @/tmp/register.json \
            --output /tmp/register-response.json --write-out '%{http_code}' \
            "$BASE/api/auth/register")"
          test "$register_status" = "201" || { echo "register expected 201, got $register_status"; cat /tmp/register-response.json; exit 1; }

          alerts_api_status="$(curl --silent --show-error --location \
            --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt \
            --output /tmp/alerts-api.json --write-out '%{http_code}' \
            "$BASE/api/mobile/alerts?limit=5")"
          test "$alerts_api_status" = "200" || { echo "mobile alerts expected 200, got $alerts_api_status"; cat /tmp/alerts-api.json; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/alerts-api.json', 'utf8'));
          if (body.success !== true) throw new Error(`alerts success=${body.success}`);
          if (!Array.isArray(body.alerts)) throw new Error('alerts is not an array');
          if (typeof body.count !== 'number') throw new Error('alerts count missing');
          NODE

          alerts_page_status="$(curl --silent --show-error --location \
            --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt \
            --output /tmp/alerts-page.html --write-out '%{http_code}' \
            "$BASE/dashboard/alerts")"
          test "$alerts_page_status" = "200" || { echo "alerts page expected 200, got $alerts_page_status"; exit 1; }
          grep -q "Every alarm should tell you exactly what happened" /tmp/alerts-page.html || { echo "Alerts page expected heading missing"; exit 1; }
