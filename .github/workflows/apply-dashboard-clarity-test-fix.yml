name: Apply dashboard clarity test fixes

on:
  push:
    branches:
      - agent/web-koru-final-revamp-2026-08-21
    paths:
      - scripts/apply-dashboard-clarity-test-fix.mjs

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: agent/web-koru-final-revamp-2026-08-21
      - name: Align regression guards with final dashboard copy
        run: node scripts/apply-dashboard-clarity-test-fix.mjs
      - name: Commit aligned regression guards
        shell: bash
        run: |
          if git diff --quiet -- tests/dashboard-routes.test.mjs tests/koru-homepage.test.mjs tests/public-dashboard-lifecycle.test.mjs; then
            echo "Regression guards already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dashboard-routes.test.mjs tests/koru-homepage.test.mjs tests/public-dashboard-lifecycle.test.mjs
          git commit -m "Align dashboard clarity regression guards"
          git push
