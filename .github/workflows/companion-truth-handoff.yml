name: Companion Truth Handoff

on:
  push:
    paths:
      - ".handoff/companion-truth/READY"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/web-koru-final-revamp-2026-08-21
          fetch-depth: 1
      - name: Reconcile canonical companion truth
        shell: python
        run: |
          from pathlib import Path
          p = Path("docs/fatedrop-product-truth.md")
          text = p.read_text()
          replacements = {
              "_Last reviewed: 22 August 2026_": "_Last reviewed: 23 August 2026_",
              "**Status: BETA presentation / BETA Web renderer / asset handoff ongoing.**": "**Status: BETA presentation / BETA Web renderer.**",
              "On Web, registered assets render their real mesh and texture through the lightweight WebGL boundary. Aeris, Nyxen and Solix are currently registered; Fenn's verified reaction pack still requires its final binary handoff/registration, and Koru keeps the approved 2D mascot fallback until the correct production GLB is recovered and verified.": "On Web, all five active companion slots have registered GLB display assets: Koru, Fenn, Aeris, Nyxen and Solix. Registered assets render their real mesh and texture through the lightweight WebGL boundary. Koru remains FateDrop's fixed mascot, network voice and default companion; Fenn is a separate selectable Koru & Friends companion. Oru remains a FateDrop-world / merch character and is not a sixth selectable signal companion.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected canonical text not found: {old}")
              text = text.replace(old, new, 1)
          p.write_text(text)
      - name: Commit truth update and remove one-shot handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .handoff/companion-truth
          rm -f .github/workflows/companion-truth-handoff.yml
          git config user.name "FateDrop Truth Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add docs/fatedrop-product-truth.md .handoff/companion-truth .github/workflows/companion-truth-handoff.yml
          git commit -m "Reconcile all-five companion product truth"
          git push origin HEAD:agent/web-koru-final-revamp-2026-08-21
