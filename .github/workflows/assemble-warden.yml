name: Assemble Warden asset

on:
  push:
    branches:
      - feat/warden-production-model
    paths:
      - 'public/assets/companions/.warden-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/warden-production-model
          fetch-depth: 0

      - name: Assemble optimized Signal Warden GLB
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/companions/.warden-parts/part-* > /tmp/fatedrop-female.glb.xz
          xz -dc /tmp/fatedrop-female.glb.xz > public/assets/companions/fatedrop-female.glb
          test "$(head -c 4 public/assets/companions/fatedrop-female.glb)" = "glTF"
          test "$(stat -c %s public/assets/companions/fatedrop-female.glb)" -eq 575076
          rm -rf public/assets/companions/.warden-parts

      - name: Commit assembled production asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/companions/fatedrop-female.glb public/assets/companions/.warden-parts
          git commit -m "Add optimized Signal Warden production GLB"
          git push origin HEAD:feat/warden-production-model
