name: P0 Signal Health Live Check

on:
  push:
    branches:
      - diagnostic/p0-signal-health-live-2026-08-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live Signal and natural Expo receipt outcomes
        shell: bash
        run: |
          set -euo pipefail

          signal_code="$(curl --silent --show-error --retry 5 --retry-delay 2 --output /tmp/signal.json --write-out '%{http_code}' 'https://fatedrop.co.uk/api/health/signal')"
          push_code="$(curl --silent --show-error --retry 5 --retry-delay 2 --output /tmp/push.json --write-out '%{http_code}' 'https://fatedrop.co.uk/api/health/push?detail=1')"

          echo "Signal health HTTP $signal_code"
          echo "Push health HTTP $push_code"

          node <<'NODE'
          const fs = require('fs');
          const signal = JSON.parse(fs.readFileSync('/tmp/signal.json','utf8'));
          const push = JSON.parse(fs.readFileSync('/tmp/push.json','utf8'));
          console.log('signalHealth', {
            available: signal.available === true,
            latestSignalAt: signal?.discord?.latestSignalAt ?? null,
            recentSignals24h: signal?.discord?.recentSignals ?? null,
            recentDiscordAttempts24h: signal?.discord?.recentDiscordAttempts ?? null,
          });
          console.log('pushNatural24h', {
            total: push.naturalOutbox24h ?? null,
            whisper: push.naturalWhisperOutbox24h ?? null,
            sent: push.outbox24hSent ?? null,
            failed: push.outbox24hFailed ?? null,
          });
          console.log('naturalReceipts24h', {
            schemaReady: push.receiptSchemaReady ?? null,
            eligible: push.naturalReceiptEligible24h ?? null,
            ok: push.naturalReceiptOk24h ?? null,
            error: push.naturalReceiptError24h ?? null,
            pending: push.naturalReceiptPending24h ?? null,
            latestCheckedAgeSeconds: push.latestNaturalReceiptCheckedAgeSeconds ?? null,
          });
          console.log('naturalWhisperReceipts24h', {
            eligible: push.naturalWhisperReceiptEligible24h ?? null,
            ok: push.naturalWhisperReceiptOk24h ?? null,
            error: push.naturalWhisperReceiptError24h ?? null,
            pending: push.naturalWhisperReceiptPending24h ?? null,
          });
          console.log('recipientGate', {
            enabledEndpointCount: push.enabledEndpointCount ?? null,
            eligibleRecipientCount: push.eligibleRecipientCount ?? null,
            pushEnabledRecipientCount: push.pushEnabledRecipientCount ?? null,
            whisperEnabledRecipientCount: push.whisperEnabledRecipientCount ?? null,
            sealedTcgEnabledRecipientCount: push.sealedTcgEnabledRecipientCount ?? null,
            quietHoursEnabledRecipientCount: push.quietHoursEnabledRecipientCount ?? null,
          });
          console.log('pushHeartbeat', {
            ok: push.ok === true,
            ageSeconds: push.ageSeconds ?? null,
            lastQueued: push.lastQueued ?? null,
            lastClaimed: push.lastClaimed ?? null,
            lastSent: push.lastSent ?? null,
            lastFailed: push.lastFailed ?? null,
            lastError: push.lastError ?? null,
          });
          if (signal.available !== true) process.exit(2);
          if (push.ok !== true) process.exit(3);
          if (push.receiptSchemaReady !== true) process.exit(4);
          NODE

          test "$signal_code" = "200"
          test "$push_code" = "200"
