name: P0 Signal Health Live Check

on:
  push:
    branches:
      - diagnostic/p0-signal-health-live-2026-08-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll live Web Signal health bridge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            code="$(curl --silent --show-error \
              --output /tmp/signal-health.json \
              --write-out '%{http_code}' \
              'https://fatedrop.co.uk/api/health/signal' || true)"
            reason="$(node -e 'const fs=require("fs"); try { const b=JSON.parse(fs.readFileSync("/tmp/signal-health.json","utf8")); process.stdout.write(String(b.reason || (b.available === true ? "available" : "unknown"))); } catch { process.stdout.write("non_json"); }')"
            echo "attempt=$attempt http=$code reason=$reason"
            if [ "$code" = "200" ]; then
              node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync("/tmp/signal-health.json","utf8")); if(b.available!==true) process.exit(2); console.log({available:true,retailerTotal:b?.retailers?.total??null,deliveryIssues:b?.delivery?.issues??null,discoveryAvailable:b?.discovery?.available??null});'
              exit 0
            fi
            sleep 15
          done
          echo "Signal health bridge did not recover inside the deployment window."
          exit 1
