name: P0 Signal Health Live Check

on:
  push:
    branches:
      - diagnostic/p0-signal-health-live-2026-08-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Cloud public Signal summary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --retry 5 --retry-delay 2 --output /tmp/summary.json --write-out '%{http_code}' 'https://fatedrop-cloud-production.up.railway.app/api/signal-summary')"
          echo "Cloud public Signal summary HTTP $code"
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/summary.json','utf8'));
          const d = body?.diagnostics || {};
          console.log('publicSummary', {
            available: body.available === true,
            source: body.source ?? null,
            generatedAt: body.generatedAt ?? null,
            lifecycleAbsentStages: Array.isArray(d.absentLifecycleStages) ? d.absentLifecycleStages : null,
            deliveryIssues: d.discordDeliveryIssues ?? null,
            retailerTotal: d?.monitors?.totalRetailers ?? null,
            discoveryAvailable: d?.discovery?.available ?? null,
            recentSignals: d?.reliability?.recentSignals ?? null,
          });
          if (body.available !== true) process.exit(2);
          if (!d || typeof d !== 'object') process.exit(3);
          if (typeof d?.monitors?.totalRetailers !== 'number') process.exit(4);
          NODE
          test "$code" = "200"
