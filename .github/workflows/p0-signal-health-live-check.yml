name: P0 Signal Health Live Check

on:
  push:
    branches:
      - diagnostic/p0-signal-health-live-2026-08-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live push heartbeat and Signal health after fallback deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "post_web_fallback_deploy=true"

          push_code="$(curl --silent --show-error --output /tmp/push.json --write-out '%{http_code}' 'https://fatedrop.co.uk/api/health/push?detail=1' || true)"
          echo "push health HTTP $push_code"
          node <<'NODE'
          const fs = require('fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/push.json','utf8')); } catch {}
          console.log('pushHeartbeat', {
            ok: body.ok === true,
            status: body.status ?? null,
            ageSeconds: body.ageSeconds ?? null,
            lastQueued: body.lastQueued ?? null,
            lastClaimed: body.lastClaimed ?? null,
            lastSent: body.lastSent ?? null,
            lastFailed: body.lastFailed ?? null,
            lastError: body.lastError ?? null,
          });
          NODE

          signal_code="$(curl --silent --show-error --output /tmp/signal.json --write-out '%{http_code}' 'https://fatedrop.co.uk/api/health/signal' || true)"
          echo "signal health HTTP $signal_code"
          node <<'NODE'
          const fs = require('fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/signal.json','utf8')); } catch {}
          console.log('signalHealth', {
            available: body.available === true,
            reason: body.reason ?? null,
            lifecycleAbsentStages: Array.isArray(body?.lifecycle?.absentStages) ? body.lifecycle.absentStages : null,
            deliveryIssues: body?.delivery?.issues ?? null,
            retailerTotal: body?.retailers?.total ?? null,
            discoveryAvailable: body?.discovery?.available ?? null,
          });
          NODE

          test "$push_code" = "200"
